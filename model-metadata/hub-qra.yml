model_id: hub-qra
team_name: Swedish Influenza Forecast Hub
team_abbr: hub
model_name: Regularized quantile regression averaging ensemble
model_abbr: qra
model_version: 1.1.0
model_contributors:
  - name: Swedish Influenza Forecast Hub
    affiliation: Chalmers University of Technology, Department of Mathematical Sciences
methods: >-
  L1-regularized quantile regression averaging with one coefficient vector per
  quantile shared by every location and forecast horizon. Regularization is
  selected by temporally ordered expanding-origin validation. This pooled
  specification is used retrospectively for 2025/2026 and prospectively from
  the forecast origin 22 November 2026.
method_category: ensemble
data_sources:
  - Swedish Influenza Forecast Hub model submissions
  - Swedish Influenza Forecast Hub target data
software:
  - Python 3.12
  - scikit-learn
code_repository: https://github.com/philipgerlee/swedish_forecasting_hub/tree/main/evaluation-pipeline
code_license: GPL-3.0-only
license: CC-BY-4.0
designated_model: true
