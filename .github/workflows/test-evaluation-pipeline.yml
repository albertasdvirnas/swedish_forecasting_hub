name: Test evaluation pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evaluation-pipeline/**"
      - "retrospective-data/**"
      - "demo-models/**"
      - "model-output/**"
      - "model-metadata/**"
      - "evaluation-output/**"
      - ".github/workflows/test-evaluation-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "evaluation-pipeline/**"
      - "retrospective-data/**"
      - "demo-models/**"
      - "model-output/**"
      - "model-metadata/**"
      - "evaluation-output/**"
      - ".github/workflows/test-evaluation-pipeline.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluation-pipeline/pyproject.toml
      - name: Install evaluation pipeline
        run: python -m pip install -e evaluation-pipeline
      - name: Run development tests
        run: python -m unittest discover -s evaluation-pipeline/tests -v
      - name: Verify demonstration forecasts are reproducible
        run: python demo-models/generate_demo_forecasts.py --check
      - name: Verify current fixed inputs
        run: |
          match-retrospective-forecasts --allow-empty \
            --output /tmp/current-evaluation/matched-forecasts.csv \
            --report /tmp/current-evaluation/match-report.json
          score-retrospective-point-forecasts --allow-empty \
            --input /tmp/current-evaluation/matched-forecasts.csv \
            --output-root /tmp/current-evaluation/point-scores
          build-retrospective-qra --allow-empty \
            --input /tmp/current-evaluation/matched-forecasts.csv \
            --output-root /tmp/current-evaluation/qra
          score-retrospective-qra --allow-empty \
            --qra-input /tmp/current-evaluation/qra/qra-forecasts.csv \
            --matched-input /tmp/current-evaluation/matched-forecasts.csv \
            --output-root /tmp/current-evaluation/qra-scores
          build-retrospective-probabilistic-baseline --allow-empty \
            --output-root /tmp/current-evaluation/probabilistic-baseline \
            --hubverse-output-root /tmp/current-evaluation/hubverse-model-output
          compare-retrospective-probabilistic-forecasts --allow-empty \
            --qra-input /tmp/current-evaluation/qra/qra-forecasts.csv \
            --baseline-input /tmp/current-evaluation/probabilistic-baseline/normal-ma3-baseline-forecasts.csv \
            --matched-input /tmp/current-evaluation/matched-forecasts.csv \
            --output-root /tmp/current-evaluation/probabilistic-comparison
          build-dashboard-hub-view \
            --qra-input /tmp/current-evaluation/qra/qra-forecasts.csv \
            --baseline-input /tmp/current-evaluation/probabilistic-baseline/normal-ma3-baseline-forecasts.csv \
            --output-root /tmp/current-evaluation/dashboard-hub-view
          build-current-qra \
            --matched-input /tmp/current-evaluation/matched-forecasts.csv \
            --output-root /tmp/current-evaluation/current-qra
          build-dashboard-bundle \
            --matched-input /tmp/current-evaluation/matched-forecasts.csv \
            --retrospective-qra /tmp/current-evaluation/qra/qra-forecasts.csv \
            --current-qra /tmp/current-evaluation/current-qra/current-qra.csv \
            --output-root /tmp/current-evaluation/dashboard-bundle
          test -s /tmp/current-evaluation/dashboard-bundle/manifest.json
          test -s /tmp/current-evaluation/dashboard-bundle/current-point.csv
          test -s /tmp/current-evaluation/dashboard-bundle/current-qra.csv
      - name: Rebuild committed demonstration results
        run: |
          mkdir -p /tmp/demo-model-output
          cp -R model-output/hubdemo-* /tmp/demo-model-output/
          match-retrospective-forecasts \
            --model-output-root /tmp/demo-model-output \
            --output /tmp/matched-forecasts.csv \
            --report /tmp/match-report.json
          score-retrospective-point-forecasts \
            --input /tmp/matched-forecasts.csv \
            --output-root /tmp/point-scores
          build-retrospective-qra \
            --input /tmp/matched-forecasts.csv \
            --output-root /tmp/qra
          score-retrospective-qra \
            --qra-input /tmp/qra/qra-forecasts.csv \
            --matched-input /tmp/matched-forecasts.csv \
            --output-root /tmp/qra-scores
          build-retrospective-probabilistic-baseline \
            --output-root /tmp/probabilistic-baseline \
            --hubverse-output-root /tmp/hubverse-model-output
          compare-retrospective-probabilistic-forecasts \
            --qra-input /tmp/qra/qra-forecasts.csv \
            --baseline-input /tmp/probabilistic-baseline/normal-ma3-baseline-forecasts.csv \
            --matched-input /tmp/matched-forecasts.csv \
            --output-root /tmp/probabilistic-comparison
          build-dashboard-hub-view \
            --qra-input /tmp/qra/qra-forecasts.csv \
            --baseline-input /tmp/probabilistic-baseline/normal-ma3-baseline-forecasts.csv \
            --output-root /tmp/dashboard-hub-view
      - name: Verify committed demonstration results are reproducible
        run: |
          diff evaluation-output/2025-2026/matched-forecasts.csv /tmp/matched-forecasts.csv
          diff evaluation-output/2025-2026/match-report.json /tmp/match-report.json
          for file in point-errors.csv point-metrics-by-location-horizon.csv point-metrics-by-forecast-kind.csv point-score-report.json; do
            diff "evaluation-output/2025-2026/$file" "/tmp/point-scores/$file"
          done
          for file in qra-forecasts.csv qra-coefficients.csv; do
            python demo-models/compare_numeric_csv.py "evaluation-output/2025-2026/$file" "/tmp/qra/$file"
          done
          for file in qra-skipped-tasks.json qra-report.json; do
            diff "evaluation-output/2025-2026/$file" "/tmp/qra/$file"
          done
          for file in qra-scores.csv qra-metrics-by-location-horizon.csv; do
            python demo-models/compare_numeric_csv.py "evaluation-output/2025-2026/$file" "/tmp/qra-scores/$file"
          done
          diff evaluation-output/2025-2026/qra-score-report.json /tmp/qra-scores/qra-score-report.json
          python demo-models/compare_numeric_csv.py \
            evaluation-output/2025-2026/normal-ma3-baseline-forecasts.csv \
            /tmp/probabilistic-baseline/normal-ma3-baseline-forecasts.csv
          for file in normal-ma3-baseline-report.json normal-ma3-baseline-skipped-tasks.json; do
            diff "evaluation-output/2025-2026/$file" "/tmp/probabilistic-baseline/$file"
          done
          for file in normal-ma3-baseline-scores.csv normal-ma3-baseline-metrics-by-location-horizon.csv probabilistic-comparison.csv probabilistic-comparison-by-location-horizon.csv; do
            python demo-models/compare_numeric_csv.py \
              "evaluation-output/2025-2026/$file" \
              "/tmp/probabilistic-comparison/$file"
          done
          diff evaluation-output/2025-2026/probabilistic-comparison-report.json \
            /tmp/probabilistic-comparison/probabilistic-comparison-report.json
          test "$(find /tmp/hubverse-model-output/hub-normalma3 -name '*.csv' | wc -l)" -eq 33
          test "$(find /tmp/dashboard-hub-view/model-output/hub-qra -name '*.csv' | wc -l)" -eq 25
          test "$(find /tmp/dashboard-hub-view/model-output/hub-normalma3 -name '*.csv' | wc -l)" -eq 33
          test "$(find /tmp/dashboard-hub-view/predtimechart-targets -name '*.json' | wc -l)" -eq 99
