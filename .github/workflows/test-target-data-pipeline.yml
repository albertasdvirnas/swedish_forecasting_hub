name: Test target-data pipeline

on:
  pull_request:
    paths:
      - "retrospective-data/**"
      - "target-data-pipeline/**"
      - ".github/workflows/test-target-data-pipeline.yml"
      - ".github/workflows/publish-data-release.yml"
  push:
    branches: [main]
    paths:
      - "retrospective-data/**"
      - "target-data-pipeline/**"
      - ".github/workflows/test-target-data-pipeline.yml"
      - ".github/workflows/publish-data-release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target-data-pipeline/pyproject.toml
      - name: Install pipeline
        run: python -m pip install -e target-data-pipeline
      - name: Run development tests
        run: python -m unittest discover -s target-data-pipeline/tests -v
      - name: Verify retrospective data artifacts
        run: build-retrospective-influenza-data --verify-only
